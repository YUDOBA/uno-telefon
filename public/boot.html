<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1220">
  <title>Dapai</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0b1220}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
    .in{text-align:center;width:100%;max-width:280px}
    img{width:148px;height:148px;display:block;margin:0 auto 18px;border-radius:28px}
    .t{margin:0;color:#f4e27a;font:700 20px/1.2 system-ui,sans-serif}
    .bar{height:4px;background:#1f3a28;border-radius:4px;overflow:hidden;margin:18px 28px 0}
    .bar i{display:block;height:100%;width:40%;background:#f4e27a;border-radius:4px;animation:bootslide 1.2s ease-in-out infinite}
    .s{margin:14px 0 0;color:#c9d6c4;font:15px/1.3 system-ui,sans-serif;min-height:20px}
    @keyframes bootslide{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
  </style>
</head>
<body>
  <div id="boot"><div class="in">
    <img src="/icon.svg" alt="Dapai">
    <p class="t">Dapai yükleniyor</p>
    <div class="bar"><i></i></div>
    <p class="s" id="sub"></p>
  </div></div>
  <script>
    // Sunucu ayaktaysa en az 5 sn, uyuyorsa uyanana kadar bekler; sonra oyuna geçer
    var t0 = Date.now(), sub = document.getElementById("sub");
    function goLive() {
      try { sessionStorage.setItem("yd_from_boot", "1"); } catch (e) {}
      location.replace("/?live=1&t=" + Date.now());
    }
    function ping() {
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = setTimeout(function () { try { ctrl && ctrl.abort(); } catch (e) {} }, 4000);
      fetch("/health", { cache: "no-store", signal: ctrl && ctrl.signal })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (j) {
          clearTimeout(timer);
          if (!j || !j.ok) throw new Error("x");
          setTimeout(goLive, Math.max(0, 5000 - (Date.now() - t0)));
        })
        .catch(function () {
          clearTimeout(timer);
          if (Date.now() - t0 > 8000) sub.textContent = "Sunucu uyanıyor, biraz sürebilir…";
          setTimeout(ping, 1500);
        });
    }
    ping();
  </script>
</body>
</html>
