<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Uno Telefon</title>
  <link rel="stylesheet" href="/style.css?v=38" />
</head>
<body>
  <div id="sure-fixed" class="panel" style="border:2px solid #ffd000;margin:8px 0 12px">
    <label>SIRA SURESI</label>
    <select id="tmode" onchange="var w=document.getElementById('tsecwrap');if(w)w.style.display=this.value==='0'?'none':'block'">
      <option value="0">Suresiz</option>
      <option value="1">Sureli</option>
    </select>
    <div id="tsecwrap" style="display:none">
      <label>Saniye</label>
      <input id="tsec" inputmode="numeric" value="20" />
    </div>
  </div>
  <div id="app">
    <div class="logo">UNO</div>
    <p class="sub" style="text-align:center">Uno Telefon</p>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/c1.js?v=38"></script>
  <script src="/c2.js?v=38"></script>
  <script>
    function readTurnSec(){
      var mode=document.getElementById('tmode');
      var secEl=document.getElementById('tsec');
      if(!mode||mode.value==='0') return 0;
      var n=parseInt(secEl&&secEl.value,10)||20;
      if(n<5)n=5; if(n>180)n=180; return n;
    }
    doCreate = function(){
      var name=((document.getElementById('name')||{}).value||'').trim()||'Kurucu';
      me.name=name;
      socket.emit('create',{name:name,maxPlayers:(document.getElementById('max')||{}).value||4,turnSeconds:readTurnSec()});
    };
    var _render0 = render;
    render = function(){
      _render0();
      var box=document.getElementById('sure-fixed');
      if(box) box.style.display = (screen==='home'||screen==='create'||screen==='lobby') ? 'block' : 'none';
    };
    try { render(); } catch(e) {}
  </script>
</body>
</html>
