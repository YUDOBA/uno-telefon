<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dapai">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Dapai</title>
  <link rel="stylesheet" href="/style.css?v=95">
  <style>
    #boot{position:fixed;inset:0;z-index:9998;background:#0b1220;display:flex;align-items:center;justify-content:center;padding:24px}
    #boot .in{text-align:center;width:100%;max-width:280px}
    #boot img{width:148px;height:148px;display:block;margin:0 auto 18px;border-radius:28px}
    #boot .t{margin:0;color:#f4e27a;font:700 20px/1.2 system-ui,sans-serif}
    #boot .bar{height:4px;background:#1f3a28;border-radius:4px;overflow:hidden;margin:18px 28px 0}
    #boot .bar i{display:block;height:100%;width:40%;background:#f4e27a;border-radius:4px;animation:bootslide 1.2s ease-in-out infinite}
    #boot .s{margin:14px 0 0;color:#c9d6c4;font:15px/1.3 system-ui,sans-serif;min-height:20px}
    @keyframes bootslide{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
  </style>
</head>
<body>
  <div id="boot"><div class="in">
    <img src="/icon.svg" alt="Dapai">
    <p class="t">Dapai yükleniyor</p>
    <div class="bar"><i></i></div>
    <p class="s" id="bootSub"></p>
  </div></div>
  <div id="app"></div>
  <div id="toast"></div>
  <script>window.__bootT0 = Date.now();</script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=95"></script>
</body>
</html>
