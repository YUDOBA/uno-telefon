<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070b14" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Uno Telefon</title>
  <link rel="stylesheet" href="/style.css?v=27" />
</head>
<body>
  <div id="app">
    <div class="logo">UNO</div>
    <p class="sub" style="text-align:center">Uno Telefon V27</p>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js?v=27"></script>
  <script>
    function ver(){ return "<p class=\"sub\" style=\"text-align:center;margin-top:18px\">Uno Telefon V27</p>"; }
    try { render(); } catch (e) {}
    function keepAlive() {
      try {
        fetch("/health");
        if (typeof socket === "undefined") return;
        if (!socket.connected) {
          socket.connect();
          var code = localStorage.getItem("uno_code") || "";
          var token = localStorage.getItem("uno_token") || "";
          var name = localStorage.getItem("uno_name") || "";
          if (code && token) socket.emit("join", { name: name, code: code, token: token });
        } else {
          socket.emit("ping");
        }
      } catch (e) {}
    }
    setInterval(keepAlive, 20000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) keepAlive(); });
    window.addEventListener("pageshow", keepAlive);
  </script>
</body>
</html>
